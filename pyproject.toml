[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unite"
version = "0.1.0"
description = "UNITE: Communication-Efficient Distributed Inference for Video Diffusion Models with Latent Parallelism"
authors = [
    { name = "UNITE Authors" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "opencv-python>=4.9.0.80",
    "diffusers>=0.31.0",
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "ftfy",
    "imageio-ffmpeg",
    "numpy>=1.23.5,<2",
    "xfuser>=0.4.1",
]

[project.optional-dependencies]
vbench = ["vbench"]
dev = ["pytest", "black", "flake8", "isort"]

[project.urls]
# Built on Wan2.1 (Alibaba Wan Team). See LICENSE.txt for upstream attribution.
paper = "paper.pdf"

[tool.setuptools]
packages = ["wan"]

[tool.setuptools.package-data]
"wan" = ["**/*.py"]
